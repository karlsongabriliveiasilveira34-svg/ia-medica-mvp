# SonarQube & SonarLint Configuration for MedIA
sonar.projectKey=ia-medica-mvp
sonar.projectName=MedIA - Inteligência Clínica & Copiloto Médico
sonar.projectVersion=1.0.0

# Encoding & Sources
sonar.sourceEncoding=UTF-8
sonar.sources=src,frontend/src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.js,**/*.test.js,**/scratch/**,frontend/android/**,frontend/ios/**

# JavaScript / TypeScript Rules
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
